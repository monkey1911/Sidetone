name: Build

# Builds Sidetone (sidetone, sidetone-cli) + libvocoder natively on ARM64 and x86-64 Linux runners (and Android, macOS and Windows below), runs the offline
# self-test on each, and uploads one tarball per architecture. Publishing a GitHub Release
# also attaches them.

on:
  # No tag trigger: publishing a release also pushes its tag, and a second run uploading the
  # same files at the same time made the two runs delete each other's uploads (--clobber).
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # arch is the .NET runtime identifier suffix; elf is what file(1) calls the machine
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf: aarch64
            appimage: aarch64
          - arch: x64
            runner: ubuntu-24.04
            elf: x86-64
            appimage: x86_64

    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      RID: linux-${{ matrix.arch }}
      ELF: ${{ matrix.elf }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # a real text-to-speech engine, so the self-test speaks with one (Sidetone itself doesn't need it to build)
      - name: Install espeak-ng
        run: sudo apt-get install -y --no-install-recommends espeak-ng >/dev/null

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build libvocoder
        run: |
          cmake -S extern/dvmvocoder -B build/vocoder -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vocoder -j"$(nproc)"
          mkdir -p build/native
          cp "$(find build/vocoder -name 'libvocoder.so' | head -1)" build/native/

      # sidetone-cli (terminal) and sidetone (graphical) are published into the same folder; they share the runtime and sidetone-core
      - name: Publish sidetone-cli (self-contained)
        run: dotnet publish src/sidetone-cli/sidetone-cli.csproj -c Release -r "$RID" --self-contained true -o "out/sidetone-$RID"

      - name: Publish sidetone (self-contained)
        run: dotnet publish src/sidetone/sidetone.csproj -c Release -r "$RID" --self-contained true -o "out/sidetone-$RID"

      - name: Verify binaries match the target architecture
        run: |
          for f in sidetone-cli sidetone libvocoder.so; do
            test -f "out/sidetone-$RID/$f" || { echo "::error::$f missing from publish output"; exit 1; }
            desc="$(file -b "out/sidetone-$RID/$f")"
            echo "$f: $desc"
            case "$desc" in *"$ELF"*) ;; *) echo "::error::$f is not $ELF"; exit 1;; esac
          done

      - name: Self-test
        run: out/sidetone-$RID/sidetone-cli selftest

      # Renders the GUI off-screen (no display needed) in both themes. The PNGs go into the log as
      # base64 so they can be looked at without downloading an artifact.
      - name: GUI renders in light and dark, and its keyboard shortcuts work
        run: |
          out/sidetone-$RID/sidetone --version
          out/sidetone-$RID/sidetone --selfcheck
          shot() {  # name, then sidetone options
            name="$1"; shift
            out/sidetone-$RID/sidetone --screenshot "out/gui-$name.png" --demo --size 1180x760 "$@"
            test -s "out/gui-$name.png" || { echo "::error::no screenshot: $name"; exit 1; }
            file -b "out/gui-$name.png"
            echo "-----BEGIN PNG $name-----"
            base64 -w 120 "out/gui-$name.png"
            echo "-----END PNG $name-----"
          }
          shot dark --theme dark
          shot light --theme light
          shot radio --theme dark --show radio
          shot page --theme light --show page
          shot settings --theme dark --show settings
          shot settings-light --theme light --show settings
          shot keyfile --theme dark --show keyfile
          shot patch --theme dark --show patch
          shot recall --theme light --show recall
          shot tabs --theme dark --show tabs
          shot outputs --theme light --show outputs
          shot announce --theme dark --show announce
          # the phone layout (narrower than 700 px), as on an Android phone
          shot phone --theme dark --size 412x915
          shot phone-more --theme light --size 412x915 --show more
          shot offline --theme dark --show offline
          # the first-run view, with no codeplug
          out/sidetone-$RID/sidetone --screenshot out/gui-welcome.png --no-settings --theme dark --size 1180x760
          echo "-----BEGIN PNG welcome-----"
          base64 -w 120 out/gui-welcome.png
          echo "-----END PNG welcome-----"

      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots-linux-${{ matrix.arch }}
          path: out/gui-*.png
          if-no-files-found: error

      - name: Package
        run: |
          cp README.md LICENSE "out/sidetone-$RID/"
          # the launcher entry and icons, for packages (the Arch PKGBUILD installs them from here)
          mkdir -p "out/sidetone-$RID/desktop"
          cp packaging/sidetone.desktop packaging/icons/sidetone-256.png packaging/icons/sidetone.svg "out/sidetone-$RID/desktop/"
          name="sidetone-${TAG//\//-}-$RID"
          echo "PKG=$name" >> "$GITHUB_ENV"
          mv "out/sidetone-$RID" "out/$name"
          tar -C out -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      # The AppImage: the same files in one runnable file. Run without FUSE here, as the runner may lack it.
      - name: AppImage
        run: |
          image="Sidetone-${TAG//\//-}-${{ matrix.appimage }}.AppImage"
          echo "APPIMAGE_FILE=$image" >> "$GITHUB_ENV"
          packaging/appimage/build-appimage.sh "out/$PKG" "out/$image" "$RUNNER_TEMP/appimage-tools"
          file -b "out/$image"
          export APPIMAGE_EXTRACT_AND_RUN=1
          test "$("out/$image" --version)" = "$("out/$PKG/sidetone" --version)"
          test "$("out/$image" cli --version)" = "$("out/$PKG/sidetone-cli" --version)"
          "out/$image" --selfcheck | tail -1
          (cd out && sha256sum "$image" > "$image.sha256")

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: sidetone-linux-${{ matrix.arch }}
          path: |
            out/${{ env.PKG }}.tar.gz*
            out/${{ env.APPIMAGE_FILE }}*

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both architecture jobs run this at once, so creating the release can lose a race
          # with the other job; whoever loses just uploads to the release the winner made.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Sidetone $TAG (Linux)" --prerelease \
              --notes "Linux builds for ARM64 and x86-64. See README for usage." \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$TAG" "out/$PKG.tar.gz" "out/$PKG.tar.gz.sha256" "out/$APPIMAGE_FILE" "out/$APPIMAGE_FILE.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The Arch Linux package: a PKGBUILD made from this run's two tarballs, built, installed and run in an
  # Arch container (x86-64; there is no official ARM64 Arch image). Releases get it attached.
  arch-package:
    name: arch package (x86_64)
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: sidetone-linux-*
          path: tarballs
          merge-multiple: true

      - name: Make the PKGBUILD
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props)"
          tag="${TAG//\//-}"
          if [ "${{ github.event_name }}" = "release" ] && [ "$tag" != "v$version" ]; then
            echo "::warning::release tag $tag doesn't match the version v$version"
          fi
          mkdir -p arch/sidetone-bin
          packaging/arch/make-pkgbuild.sh "$version" "$tag" \
            "tarballs/sidetone-$tag-linux-x64.tar.gz" "tarballs/sidetone-$tag-linux-arm64.tar.gz" > arch/sidetone-bin/PKGBUILD
          cp packaging/arch/sidetone.install arch/sidetone-bin/
          echo "TAG_FILE=$tag" >> "$GITHUB_ENV"
          cat arch/sidetone-bin/PKGBUILD

      - name: Build, install and run it on Arch
        run: |
          cp "tarballs/sidetone-$TAG_FILE-linux-x64.tar.gz" arch/sidetone-bin/     # makepkg uses it instead of downloading
          docker run --rm -v "$PWD/arch/sidetone-bin:/build" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            cd /build
            source PKGBUILD
            pacman -S --noconfirm --needed "${depends[@]}" >/dev/null
            useradd -m builder
            cp -r /build /home/builder/pkg && chown -R builder /home/builder/pkg
            su builder -c "cd /home/builder/pkg && makepkg -f --noconfirm"
            pacman -U --noconfirm /home/builder/pkg/sidetone-bin-*.pkg.tar.*
            pacman -Ql sidetone-bin | grep -E "usr/bin|applications|icons"
            sidetone --version
            sidetone-cli --version
            sidetone-cli selftest > /tmp/selftest.log || { grep -E "FAIL" /tmp/selftest.log; exit 1; }
            tail -1 /tmp/selftest.log
          '

      - name: Upload the PKGBUILD
        uses: actions/upload-artifact@v7
        with:
          name: sidetone-bin-PKGBUILD
          path: arch/sidetone-bin/PKGBUILD

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f arch/sidetone-bin/*.tar.gz
          tar -C arch -czf "sidetone-bin-$TAG_FILE.tar.gz" sidetone-bin
          gh release upload "$TAG" "sidetone-bin-$TAG_FILE.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  # Sidetone for Android: libvocoder built with the NDK (which runs on x86-64 hosts only) for arm64-v8a and
  # x86_64, the APK and the Play Store bundle (AAB), a check that every native library suits 16 KB memory
  # pages (Google Play requires it), and the on-device self-test on an Android 11 emulator, the oldest
  # Android Sidetone supports. Signed with the release key when the repository has it as secrets.
  android:
    name: android (apk)
    runs-on: ubuntu-24.04

    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Android workload and SDK
        run: |
          dotnet workload install android --skip-manifest-update >/dev/null || dotnet workload install android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Build libvocoder for Android
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S extern/dvmvocoder -B "build/vocoder-android-$abi" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static \
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
            cmake --build "build/vocoder-android-$abi" -j"$(nproc)"
            mkdir -p "build/android/$abi"
            cp "$(find "build/vocoder-android-$abi" -name 'libvocoder.so' | head -1)" "build/android/$abi/"
          done

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/sidetone.keystore"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so an installed copy must be uninstalled before this one installs"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Sanitise the tag for filenames
        run: |
          tag="${TAG//\//-}"
          echo "TAG_FILE=$tag" >> "$GITHUB_ENV"

      - name: Build the APK and the Play Store bundle
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          signing=()
          if [ "$SIGNED" = release ]; then
            signing=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/sidetone.keystore"
                     "-p:AndroidSigningKeyAlias=$KEY_ALIAS" "-p:AndroidSigningKeyPass=env:STORE_PASS" "-p:AndroidSigningStorePass=env:STORE_PASS")
          fi
          dotnet publish src/sidetone-android/sidetone-android.csproj -c Release -o out/android "${signing[@]}"
          ls -la out/android
          apk=$(ls out/android/*-Signed.apk | head -1)
          aab=$(ls out/android/*-Signed.aab 2>/dev/null | head -1 || true)
          test -s "$apk" || { echo "::error::no APK"; exit 1; }
          mkdir -p out/release
          cp "$apk" "out/release/Sidetone-$TAG_FILE-android.apk"
          if [ -n "$aab" ]; then cp "$aab" "out/release/Sidetone-$TAG_FILE-android.aab"; fi
          (cd out/release && sha256sum * > SHA256SUMS)
          unzip -l "$apk" | grep -E "lib/.*\.so" | awk '{print $4}' | sort | sed 's/^/  /'

      - name: Every native library suits 16 KB memory pages
        run: |
          apk="out/release/Sidetone-$TAG_FILE-android.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" | tail -1
          readelf="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          rm -rf out/apk-libs && mkdir -p out/apk-libs && unzip -q -o "$apk" 'lib/arm64-v8a/*' 'lib/x86_64/*' -d out/apk-libs
          bad=0
          # desktop libraries from NuGet don't belong in the app (Play flagged libportaudio.so, 0.40.3)
          if find out/apk-libs -name 'libportaudio.so' | grep -q .; then echo "::error::libportaudio.so is in the APK"; bad=1; fi
          for so in $(find out/apk-libs -name '*.so' | sort); do
            min=$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | head -1)
            if [ $((min)) -lt 16384 ]; then echo "::error::$so: LOAD alignment $min (needs 0x4000)"; bad=1; else echo "  ok $min ${so#out/apk-libs/}"; fi
          done
          exit $bad

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On an Android 11 emulator, the self-test passes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/android-check.sh "out/release/Sidetone-${{ env.TAG_FILE }}-android.apk" out/android-check

      - name: Upload the Android build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sidetone-android
          path: |
            out/release/*
            out/android-check/*

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" out/release/Sidetone-$TAG_FILE-android.* --repo "$GITHUB_REPOSITORY" --clobber

  # macOS: one universal Sidetone.app (both complete builds and a universal launcher, packaging/macos), built and
  # tested on Apple silicon; the Intel half is tested on an Intel runner by the next job. Runners have no sound
  # devices, so audio is checked only as far as starting PortAudio and listing what's there.
  macos:
    name: macos (universal .app)
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build libvocoder (universal)
        run: |
          cmake -S extern/dvmvocoder -B build/vocoder -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build/vocoder -j"$(sysctl -n hw.ncpu)"
          lib="$(find build/vocoder -name 'libvocoder.dylib' | head -1)"
          lipo -info "$lib"
          lipo "$lib" -verify_arch arm64 x86_64

      - name: Publish both builds
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/sidetone-cli/sidetone-cli.csproj -c Release -r $rid --self-contained true -o "out/$rid"
            dotnet publish src/sidetone/sidetone.csproj -c Release -r $rid --self-contained true -o "out/$rid"
            cp "$(find build/vocoder -name 'libvocoder.dylib' | head -1)" "out/$rid/"
          done
          file out/osx-arm64/sidetone out/osx-x64/sidetone out/osx-arm64/libportaudio.dylib out/osx-x64/libportaudio.dylib

      - name: Self-test (Apple silicon)
        timeout-minutes: 15
        run: out/osx-arm64/sidetone-cli selftest

      - name: GUI self-check (Apple silicon)
        timeout-minutes: 15
        run: |
          out/osx-arm64/sidetone --version
          out/osx-arm64/sidetone --selfcheck

      - name: Audio starts (PortAudio, Core Audio)
        run: out/osx-arm64/sidetone-cli devices || true     # a runner may have no devices; it must not crash

      - name: Make Sidetone.app
        run: |
          version="$(out/osx-arm64/sidetone --version | awk '{print $2}' | cut -d. -f1-3)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          packaging/macos/make-app.sh "$version" out/osx-arm64 out/osx-x64 out
          lipo -info out/Sidetone.app/Contents/MacOS/sidetone
          out/Sidetone.app/Contents/MacOS/sidetone --version
          out/Sidetone.app/Contents/MacOS/sidetone-cli --version
          zip="Sidetone-${TAG//\//-}-macos.zip"
          mv "out/Sidetone-$version-macos.zip" "out/$zip"
          (cd out && shasum -a 256 "$zip" > "$zip.sha256")
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: sidetone-macos
          path: out/${{ env.ZIP }}*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "out/$ZIP" "out/$ZIP.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  # The Intel half of the universal app, on an Intel Mac: unzipped as a user would, run through the launcher.
  macos-intel:
    name: macos (Intel half)
    needs: macos
    runs-on: macos-15-intel
    steps:
      - name: Get the app
        uses: actions/download-artifact@v8
        with:
          name: sidetone-macos

      - name: Self-test and GUI self-check through the launcher
        timeout-minutes: 20
        run: |
          ditto -x -k Sidetone-*-macos.zip .
          codesign --verify --deep --strict Sidetone.app
          uname -m
          Sidetone.app/Contents/MacOS/sidetone-cli selftest
          Sidetone.app/Contents/MacOS/sidetone --selfcheck

  # Windows: built and tested natively on x64 and ARM64 runners (they have no sound devices; audio is checked only as
  # far as listing what's there). The installer job puts both builds into one setup .exe (packaging/windows).
  windows:
    name: windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            cmake: x64
          - arch: arm64
            runner: windows-11-arm
            cmake: ARM64
    defaults:
      run:
        shell: bash
    env:
      RID: win-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build libvocoder (MSVC)
        run: |
          cmake -S extern/dvmvocoder -B build/vocoder -A ${{ matrix.cmake }}
          cmake --build build/vocoder --config Release
          find build/vocoder -name 'libvocoder.dll'

      - name: Publish
        run: |
          dotnet publish src/sidetone-cli/sidetone-cli.csproj -c Release -r "$RID" --self-contained true -o "out/$RID"
          dotnet publish src/sidetone/sidetone.csproj -c Release -r "$RID" --self-contained true -o "out/$RID"
          cp "$(find build/vocoder -name 'libvocoder.dll' | head -1)" "out/$RID/"

      - name: Self-test
        timeout-minutes: 15
        run: out/$RID/sidetone-cli.exe selftest

      - name: GUI self-check
        timeout-minutes: 15
        run: |
          out/$RID/sidetone.exe --version
          out/$RID/sidetone.exe --selfcheck

      - name: The programs carry the icon
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);'
          foreach ($exe in "sidetone.exe", "sidetone-cli.exe") {
            $n = [W.Shell]::ExtractIconEx((Resolve-Path "out/$env:RID/$exe").Path, -1, $null, $null, 0)
            "$exe has $n icon(s)"
            if ($n -lt 1) { throw "$exe has no icon" }
          }

      - name: Audio starts (WASAPI)
        run: out/$RID/sidetone-cli.exe devices || true     # a runner may have no devices; it must not crash

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: sidetone-${{ env.RID }}
          path: out/${{ env.RID }}
          if-no-files-found: error

  windows-installer:
    name: windows (installer)
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get both builds
        uses: actions/download-artifact@v8
        with:
          pattern: sidetone-win-*
          path: out

      - name: Make the installer
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress >/dev/null; fi
          version="$(out/sidetone-win-x64/sidetone.exe --version | awk '{print $2}' | cut -d. -f1-3)"
          win() { cygpath -w "$1"; }     # Inno Setup wants Windows paths, not Git Bash's /d/a/...
          "$iscc" //Q "//DAppVersion=$version" "//DSourceX64=$(win "$PWD/out/sidetone-win-x64")" "//DSourceArm64=$(win "$PWD/out/sidetone-win-arm64")" \
            "//O$(win "$PWD/out")" "$(win "$PWD/packaging/windows/sidetone.iss")"
          setup="Sidetone-${TAG//\//-}-windows-setup.exe"
          mv "out/Sidetone-$version-windows-setup.exe" "out/$setup"
          (cd out && sha256sum "$setup" > "$setup.sha256")
          echo "SETUP=$setup" >> "$GITHUB_ENV"

      - name: Install, run the installed self-test, uninstall
        timeout-minutes: 20
        run: |
          "out/$SETUP" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //TASKS=addtopath
          app="$LOCALAPPDATA/Programs/Sidetone"
          ls "$app" | head
          "$app/sidetone.exe" --version
          "$app/sidetone-cli.exe" selftest | tail -3
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES
          sleep 5
          test ! -f "$app/sidetone.exe" || { echo "::error::uninstall left the program behind"; exit 1; }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: sidetone-windows-setup
          path: out/${{ env.SETUP }}*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "out/$SETUP" "out/$SETUP.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  # the installer on Windows on ARM: it must pick the ARM64 build
  windows-installer-arm:
    name: windows (installer on ARM64)
    needs: windows-installer
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the installer
        uses: actions/download-artifact@v8
        with:
          name: sidetone-windows-setup

      - name: Install, check it's the ARM64 build, run the self-test, uninstall
        timeout-minutes: 20
        run: |
          ./Sidetone-*-windows-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          app="$LOCALAPPDATA/Programs/Sidetone"
          "$app/sidetone-cli.exe" selftest | tail -3
          powershell -NoProfile -Command "\$b=[IO.File]::ReadAllBytes('$app\\sidetone.exe'); \$pe=[BitConverter]::ToInt32(\$b,0x3C); \$m=[BitConverter]::ToUInt16(\$b,\$pe+4); if (\$m -ne 0xAA64) { Write-Error ('not an ARM64 program: machine 0x{0:X}' -f \$m); exit 1 } else { 'sidetone.exe is ARM64' }"
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES
